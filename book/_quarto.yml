project:
  type: book

book:
  # site-url: https://knowledge.freesearchr.org
  site-url: https://freesearchr.github.io/FreesearchR-knowledge/
  title: "FreesearchR knowledge base"
  author: "Andreas Gammelgaard Damsbo"
  date: "12/11/2026"
  chapters:
    - index.qmd
    - part: "Using the FreesearchR app"
      chapters: 
        - app/app.qmd
        - app/videos.qmd
        - app/data_types.qmd
        - app/visuals.qmd
        - qa/qa.qmd
    - part: "Background and data considerations"
      chapters: 
        - background/missingness.qmd
        - background/messy_tidy.qmd
    - part: "Case studies"
      chapters: 
        - cases/case_trial.qmd
        - cases/case_overlapping_measures.qmd
    - part: "Going even further with R"
      chapters: 
        - further/training.qmd
        - further/study.qmd
        - further/redcap.qmd
    - part: "FreesearchR community"
      chapters:
        - background/presentations.qmd
        - background/community.qmd
  appendices:
    - references.qmd
  page-footer: 
    left: "Copyright 2026, Andreas Gammelgaard Damsbo" 
    right: 
      - icon: braces
        href: https://github.com/freesearchr/
      - icon: globe 
        href: https://freesearchr.org/site/ 

bibliography: references.bib

format:
  html:
    theme:
      - cosmo
      - brand

execute:
  freeze: false ## <- necessary to build correctly
  warning: false

